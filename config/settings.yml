# Threshold the whole board is built around.
# Kalshi daily rain settles Yes only if the station's official daily total is
# strictly greater than 0.00", with trace counted as 0. The smallest reportable
# increment is 0.01", so ">0" and ">=0.01" are the same event.
threshold_inches: 0.01
threshold_mm: 0.254

# ---------------------------------------------------------------------------
# Model families.
#
# These are NOT five independent opinions. NBM ingests MOS and (through Oct 6
# 2026) HREF. NDFD is forecaster-edited NBM. Averaging all of them flat
# double-counts the blend and drowns out the convection-allowing signal.
# So: average WITHIN a family, then weight ACROSS families.
# ---------------------------------------------------------------------------
families:
  # NO CONVECTION-ALLOWING FAMILY.
  #
  # The 2026-09-04 probe settled this. HREF's ensprod prob file carries only
  # 12.7 / 25.4 / 50.8 / 76.2 / 127 / 203.2 mm -- 0.5" through 8". Those
  # products exist for flash-flood guidance; there is no 0.01" record to
  # read. And REFS ensemble output is not on NOMADS at all: rrfs.YYYYMMDD/CC/
  # holds only deterministic rrfs.tCCz.2dfld.*.grib2 files, with no ensprod/
  # directory under either para/ or v1.0/.
  #
  # The CAM signal is not lost, it is just second-hand: NBM ingests HREF and
  # HRRR, so it reaches the board through the blend. That is why `blend`
  # carries the largest weight here.
  # MOS DROPPED 2026-09-04. www.nws.noaa.gov/cgi-bin returned 403 for every
  # station from a GitHub runner -- a browser user-agent did not help, so it
  # is an IP block on the datacentre range rather than UA filtering. Its 0.10
  # is redistributed below.
  #
  # If you want it back: NOMADS itself works fine from the runner, and MOS
  # bulletins are mirrored under ftp.ncep.noaa.gov/data/nccf/com/mos/prod/.
  # That is a different host from the one that blocked us and worth a probe.
  blend:
    label: Blend
    weight: 0.45
    members: [NBM, NDFD]
  global:
    label: Global ensembles
    weight: 0.32
    members: [ECMWF_ENS, GEFS, ICON_EPS, GEM_EPS, UKMO_ENS]
  mlm:
    label: meteoblue mLM
    weight: 0.23
    members: [METEOBLUE]

# Families that return nothing are dropped and the remaining weights are
# renormalized. If only one family survives, the row is marked low-confidence.
min_families_for_signal: 2

# ---------------------------------------------------------------------------
# Edge. A flat "10 points off" rule treats a 10-point gap at 50c the same as
# one at 5c; the second is worth roughly six times as much per dollar risked.
# Everything below is in cents per contract, net of Kalshi's quadratic fee and
# net of crossing the spread.
# ---------------------------------------------------------------------------
edge:
  fee_multiplier: 0.07      # Kalshi: ceil(multiplier * C * P * (1-P)); overridden
                            # per-series from the API when available
  # An edge this large on a liquid market does not exist. Seeing one means
  # something upstream is broken -- a merged bracket ladder, a mis-parsed
  # price, a stale forecast -- so it is flagged as suspect rather than
  # presented as the best trade on the board. On 2026-09-05 this would have
  # caught +98c rows produced by two overlapping ladders being normalised
  # together.
  implausible_cents: 25.0
  flag_high_cents: 8.0
  flag_watch_cents: 4.0
  # Judged on OPEN INTEREST, not volume -- this API version returns no
  # volume field at all, only open_interest_fp. Gating on volume tags every
  # contract as thin and shows you an empty board. Observed open interest on
  # live weather markets runs from 0 to ~6600, median a few hundred.
  min_volume: 200
  # Rain books run wider than temperature books -- 8c is common. Since EV is
  # already computed at the ask, the spread has been paid for once; this gate
  # exists to catch quotes that are nominal rather than real, not to charge
  # for the spread a second time. Set high enough that a genuine 20c edge
  # survives, low enough to drop a book with nothing behind it.
  max_spread_cents: 10
  kelly_cap: 0.25           # fraction of full Kelly to suggest

# ---------------------------------------------------------------------------
# Calibration offsets, applied as logit shifts before blending.
# Start at 0. After ~30 days of history/ you can fit these from outcomes.
# HREF/REFS ensprod probabilities are NEIGHBOURHOOD maxima -- they answer
# "will it rain somewhere in a ~40km radius", which runs high for a point
# station. Expect to end up with a negative offset on those two.
# ---------------------------------------------------------------------------
calibration:
  HREF: 0.0
  REFS: 0.0
  NBM: 0.0
  NDFD: 0.0
  MOS: 0.0
  ECMWF_ENS: 0.0
  GEFS: 0.0
  ICON_EPS: 0.0
  GEM_EPS: 0.0
  UKMO_ENS: 0.0
  # meteoblue defines POP at >0.2 mm; Kalshi's bar is 0.254 mm. Theirs
  # answers an easier question so it reads high. Start negative and fit
  # the real value from history/.
  METEOBLUE: -0.15

# Correlation assumption when stitching two 12-hour POPs into one daily
# probability. 0 = independent (too high), 1 = pure max (too low).
pop_stitch_rho: 0.5

# ---------------------------------------------------------------------------
# Source endpoints. The GRIB paths change with NCEP implementations -- run
# `python -m pipeline.probe` to list what's actually on the server today
# rather than trusting these.
# ---------------------------------------------------------------------------
sources:
  kalshi:
    base: https://external-api.kalshi.com/trade-api/v2

  # Intraday station observations. Worth more than any additional model:
  # by mid-afternoon the day's high is largely set, and a recorded 0.01"
  # decides a rain contract outright. Three providers, tried in order,
  # because www.nws.noaa.gov already blocks GitHub runners.
  observations:
    enabled: true
    # Degrees of slack under the observed max before the floor bites. Covers
    # the gap between this station's METAR and The Weather Company's report.
    tolerance_f: 0.5
    # Residual width that survives however late it is. Stops the board
    # printing a 100%-confident bracket.
    min_spread_f: 1.4
    # Certainty cap once rain is already on the ground.
    rain_observed_p: 0.98
    # Reject an observed max more than this far below the forecast median.
    # A real bust of that size is far rarer than a decode or unit error, and
    # a bad reading late in the day is confidently wrong rather than just
    # wrong.
    max_below_forecast_f: 25.0

  openmeteo:
    ensemble_base: https://ensemble-api.open-meteo.com/v1/ensemble
    models:
      ECMWF_ENS: ecmwf_ifs025_ensemble
      GEFS: ncep_gefs025
      ICON_EPS: icon_seamless
      GEM_EPS: gem_global_ensemble
      # Open-Meteo rejected `ukmo_global_ensemble`. The likely id is
      # `ukmo_global_ensemble_20km`; re-run the probe after changing it and
      # delete this entry if it still 400s. Four ensembles already give ~143
      # members, so UKMO is a nice-to-have, not load-bearing.
      UKMO_ENS: ukmo_global_ensemble_20km

  ndfd:
    base: https://digital.weather.gov/xml/sample_products/browser_interface/ndfdXMLclient.php

  mos:
    # GFS MOS short-range (MAV). NAM MOS (MET) retires 2026-10-06 along with
    # the NAM, so don't build a dependency on it.
    # DISABLED: 403 from GitHub runners on every station, browser UA included.
    # ftp.ncep.noaa.gov/data/nccf/com/mos/prod/ is a plausible alternative
    # host -- NOMADS works from the runner, so that range is not blocked.
    mav: https://www.nws.noaa.gov/cgi-bin/mos/getmav.pl
    enabled: false

  href:
    enabled: false      # no 0.01in threshold exists in the prob file
    # RETIRES 2026-10-06 12Z with NAM/SREF/HiresW/NAM-MOS. Keep until then for
    # a side-by-side against REFS, then delete this block.
    base: https://nomads.ncep.noaa.gov/pub/data/nccf/com/href/prod
    pattern: "href.{ymd}/ensprod/href.t{cc}z.conus.prob.f{ff}.grib2"
    # The 2026-09-04 probe found only >12.7, >25.4 and >50.8 mm (0.5", 1",
    # 2") in the records it printed. If 0.254 really is absent from the
    # .prob. file, the 0.01in neighbourhood product is in a sibling file --
    # the next probe prints the full threshold menu so we can tell.
    idx_regex: ":APCP:surface:.*acc fcst:prob >0.254:"
    cycles: [0, 6, 12, 18]
    retires: "2026-10-06"

  refs:
    enabled: false      # no ensprod/ on NOMADS; only deterministic RRFS
    # Real-time parallel feed went up on NOMADS ~2026-08-11; operational
    # 2026-10-06 12Z. Path WILL move from the parallel dir to prod on that
    # date. AWS mirror: s3://noaa-rrfs-pds/
    base: https://nomads.ncep.noaa.gov/pub/data/nccf/com/rrfs/para
    # The 2026-09-04 walk found rrfs.YYYYMMDD/ and firewx.YYYYMMDD/ under
    # para/, and para/ + v1.0/ one level up. No refs.* anywhere, so the
    # product sits inside rrfs.YYYYMMDD -- the next probe descends to find
    # the cycle and ensprod layout.
    discover_prefixes: [rrfs, refs, firewx]
    pattern: "rrfs.{ymd}/{cc}/ensprod/refs.t{cc}z.conus.prob.f{fff}.grib2"
    idx_regex: ":APCP:surface:.*acc fcst:prob >0.254:"
    cycles: [0, 6, 12, 18]
    aws_bucket: noaa-rrfs-pds
    aws_prefix: "rrfs_a/refs.{ymd}/{cc}/ensprod/"

  nbm:
    base: https://nomads.ncep.noaa.gov/pub/data/nccf/com/blend/prod
    pattern: "blend.{ymd}/{cc}/core/blend.t{cc}z.core.f{fff}.co.grib2"
    idx_regex: ":APCP:surface:.*acc fcst:prob >0.254:"
    # NBM core runs hourly, but ONLY the 00/06/12/18Z cycles carry the 6- and
    # 12-hour accumulation products. A 2026-09-04 probe of the 22Z cycle found
    # 154 records with 1-hour windows only; the 00Z cycle had 208+ records
    # with [1, 6, 12].
    #
    # That matters enormously. Aligning to a station's local midnight lands on
    # an off-cycle (04Z, 05Z, 07Z...), where the only records available are
    # one hour wide. The tiler then stitched 5-6, 11-12, 17-18 and 23-24 into
    # what it called a daily probability -- four hours of coverage out of
    # twenty-four, silently understating every city.
    #
    # Major cycles only. The window picker's 3-hour tolerance still gets a
    # 04Z-04Z day out of the 00Z run as 6-18 plus 18-30.
    cycles: [0, 6, 12, 18]

# ===========================================================================
# TEMPERATURE MARKETS (KXHIGH*, KXLOW*)
#
# Different beast from rain. These settle on the NWS Daily Climate Report --
# not The Weather Company -- and they're brackets, not a single binary. You
# need a full predictive distribution of the daily high, then you integrate
# it over each bracket.
# ===========================================================================
temperature:
  series_prefixes: [KXHIGH]      # add KXLOW to trade lows off the same machinery

  families:
    # NBM's own TMAX mean and ensemble standard deviation, confirmed present
    # in the core file on 2026-09-05. This is the only source here that ships
    # a MEASURED spread rather than one assumed from model disagreement, so
    # it carries real weight.
    nbm:
      label: NBM (measured sigma)
      weight: 0.30
      members: [NBM_T]
    global_ens:
      label: Global ensembles
      weight: 0.35
      members: [ECMWF_ENS, GEFS, ICON_EPS, GEM_EPS, UKMO_ENS]
    # MOS dropped; NDFD does not simply inherit its share. NDFD is a single
    # deterministic number and it is forecaster-edited NBM, so it is not an
    # independent opinion -- the weight goes to the ensembles instead.
    blend:
      label: NWS guidance
      weight: 0.15
      members: [NDFD]
    mlm:
      label: meteoblue mLM
      weight: 0.20
      members: [METEOBLUE]

  # Sigma used to turn a deterministic forecast into a distribution.
  # These are placeholders -- replace with each source's actual mean absolute
  # error at YOUR stations once history/ has a month in it. Day 2 is wider
  # than day 1 and the gap grows in transitional seasons.
  deterministic_sigma:
    NDFD: {0: 2.2, 1: 3.0}
    # Only used if NBM's own ens std dev is unavailable for a city/day.
    NBM_T: {0: 2.0, 1: 2.8}
    MOS:  {0: 2.6, 1: 3.4}
    METEOBLUE: {0: 1.9, 1: 2.7}

  # Per-city grid-to-station correction, in degrees F, added to the median.
  # This is the biggest lever on the board. Fit it from history/ -- do not
  # guess. Airport stations generally run warm against the surrounding grid;
  # park and coastal stations run cool.
  bias: {}          # e.g.  New York: -1.2

  # Ensembles under-disperse 2m temperature, which underprices the outer
  # brackets. >1 widens. Fit per city; this is the global default.
  spread_factor: 1.15

  edge:
    fee_multiplier: 0.07
    implausible_cents: 25.0
    flag_high_cents: 6.0
    flag_watch_cents: 3.0
    min_volume: 100         # open interest; see the rain note above
    max_spread_cents: 5
    kelly_cap: 0.20

  sources:
    # TMAX + `ens std dev` live in the NBM core file, same cycles as the
    # precipitation products.
    nbm_temp:
      enabled: true
      base: https://nomads.ncep.noaa.gov/pub/data/nccf/com/blend/prod
      pattern: "blend.{ymd}/{cc}/core/blend.t{cc}z.core.f{fff}.co.grib2"
      cycles: [0, 6, 12, 18]

    meteoblue:
      base: https://my.meteoblue.com/packages
      # Set METEOBLUE_KEY as an Actions secret. Without it this source is
      # skipped and its family weight is redistributed.
      #
      # NOT available through Windy's Point Forecast API -- that serves
      # arome/icon/gfs/nam/hrrr/canHrdps only. meteoblue on Windy is a
      # licensed display layer; scraping it breaks their terms.
      api_key: null

      # --- which probabilistic extras to pull -------------------------
      # predictability and precipitation_probability ride along in
      # basic-day at no extra cost -- always on.
      #
      # rainSPOT needs sub-daily resolution, so it upgrades the call from
      # basic-day to basic-3h and roughly doubles the credit cost. It buys
      # you a direct measurement of the area-to-point discount that the
      # HREF/REFS neighbourhood probabilities need.
      use_rainspot: true
      # Which package carries rainSPOT. Check the sample URL meteoblue gave
      # you: `basic-1h_basic-day` means your key covers basic-1h. Asking for
      # a package your key lacks fails the whole call.
      rainspot_package: basic-1h
      # temperature_spread is a separate package on top. It replaces the
      # guessed sigmas in deterministic_sigma with meteoblue's own ensemble
      # standard deviation, per city per day.
      use_temperature_spread: false

      # How hard meteoblue's confidence score widens the temperature
      # distribution. 0 disables. 0.6 means a 50%-predictability day gets
      # 1.3x the spread of a 100% day.
      predictability_k: 0.6

      # This scaled the CAM family, which no longer exists -- there is no
      # neighbourhood-maximum source left to discount. Keep it off. The
      # rainSPOT wet-area fraction is still recorded on the board as a
      # coverage diagnostic, and it stays useful: a low wet fraction on a
      # high-probability day means scattered convection, where a point
      # station is a very different bet from the surrounding area.
      apply_coverage_to_cam: false
      coverage_floor: 0.35

      # --- free-trial budget -------------------------------------------
      # The trial is 10,000,000 credits for one year. Verify these costs in
      # meteoblue's own configurator -- they are estimates.
      credit_costs:
        basic_day: 4000
        basic_3h: 8000
        basic_1h: 8000
        # trend-day is usually NOT on a trial key. If use_temperature_spread
        # errors, that's why.
        trend_day: 4000
      trial_credits: 10000000
      max_calls_per_day: 25
      cache_hours: 8          # reuse a cached value this many hours
      cache_path: .cache/meteoblue.json
      cities: []              # empty = all; list names to spend on fewer

      # --- redistribution ----------------------------------------------
      # docs/data/*.json is committed and served publicly by GitHub Pages.
      # Emitting meteoblue's forecast values there republishes their data,
      # which their licence restricts independently of whether your own use
      # is commercial. Left false, mLM still feeds the blended consensus --
      # it just isn't itemised in the published file.
      publish_values: false

# ===========================================================================
# EXECUTION -- paper only.
#
# Everything an agent would need to place orders, with the sending step
# removed. It reads the same boards, applies the policy below, sizes against
# real book depth, and writes what it WOULD have done to docs/data/paper/.
#
# Thresholds here are deliberately stricter than the display ones. The board
# shows what is worth looking at; this records what would be worth money.
# ===========================================================================
execution:
  live: false                    # not implemented, and not until calibrated

  # --- gates: reasons not to trade at all ---------------------------------
  # The important one. Every calibration knob is a guess until the scorer has
  # fitted it against outcomes, and trading an unfitted model is trading a
  # hypothesis. Set false only once temperature.bias is populated.
  require_calibration: true
  max_data_age_minutes: 180      # a stale board is a wrong board
  max_source_errors: 1

  # --- which rows qualify -------------------------------------------------
  min_edge_cents: 6.0            # above the 4c display threshold
  max_edge_cents: 25.0           # above this is a data fault, not an edge
  max_spread_cents: 5
  min_depth: 25                  # contracts actually available at the price
  max_elapsed: 0.75              # skip a day that is three-quarters gone

  # --- sizing -------------------------------------------------------------
  bankroll_dollars: 500.0
  daily_budget_dollars: 50.0     # hard stop across all orders per day
  max_per_market_dollars: 15.0   # no single contract dominates the book

  # Post inside the spread instead of crossing it. Paying the ask donates
  # several cents of a single-digit edge, and the maker fee is lower than the
  # taker fee. The trade-off is that a limit order may not fill -- the ledger
  # records the order, not an assumed fill.
  limit_improvement_cents: 1
