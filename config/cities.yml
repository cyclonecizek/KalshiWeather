# Kalshi daily-rain cities.
#
# VERIFY EVERY ROW against the market's own rules page before trading it.
# Kalshi names a settlement station per market; the CLI code below is a
# best-effort guess and the temperature markets are known to use unintuitive
# stations (Chicago=Midway, Dallas=DFW, Houston=Hobby). Rain markets may
# differ from the temperature markets for the same city.
#
# `series` may be left blank -- the pipeline discovers KXRAIN* series from
# the Kalshi API and matches on title. Fill it in once you've confirmed it.
#
# elevation_m is the station's height above sea level in metres, passed to
# meteoblue as `asl`. Without it meteoblue infers height from its own terrain
# grid, and the mismatch against the real thermometer is a slice of the
# grid-to-station temperature bias -- roughly 6.5 C per 1000 m of error.
# Only the high-elevation stations are filled in below; read the rest off the
# station metadata (the NWS station page or an airport data sheet) and fill
# them in. It costs nothing and removes bias you would otherwise have to fit.
#
# lat/lon must be the SETTLEMENT STATION's coordinates, not the city center.
# For point-forecast sources this matters; Central Park vs JFK is a real
# difference on convective days.

cities:
  - name: New York
    series: KXRAINNYC
    station: CLINYC
    icao: KNYC
    lat: 40.779
    lon: -73.969
    tz: America/New_York
    elevation_m: null
    verified: false

