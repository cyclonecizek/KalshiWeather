# Built from the 2026-09-04 probe of live Kalshi series.
#
# TWO DIFFERENT MARKET SHAPES, so two different fields:
#
#   series_high  Temperature is one series PER CITY (KXHIGHTSEA), each with
#                ~12 bracket markets. Put the exact ticker here.
#   rain_code    Rain is ONE shared series (KXRAIN, "Where will it rain
#                daily") carrying ~44 markets keyed by a city suffix:
#                KXRAIN-26SEP04-TTN. Put just the suffix here.
#
# The old per-city rain series -- KXRAINDNYC, KXRAINDC, KXRAINHOU,
# KXRAINMIA, KXRAINSEA, KXRAINNO, KXRAINNY, KXRAINNYC -- all still appear in
# the series list but returned NO OPEN MARKETS. They are legacy. Don't use
# them.
#
# rain_code values below are the complete suffix list from the 2026-09-04
# probe: 22 codes across 44 markets (22 cities x 2 days). San Diego has a
# temperature market but no rain market, so its rain_code stays null.
#
# SETTLEMENT. Rain (KXRAIN) settles on The Weather Company. Every active
# KXHIGH* series below also settles on The Weather Company -- NOT the NWS
# Climatological Report, which is what I assumed earlier and what the
# handful of dormant series like KXHIGHTEMPDEN use.
#
# lat/lon must be the SETTLEMENT STATION, not the city centre. elevation_m
# is passed to meteoblue as `asl`. Both still need verifying against each
# market's rules page; `verified: false` puts a ? on the board.

rain_series: KXRAIN

cities:
  - {name: New York,      series_high: KXHIGHNY,    rain_code: NYC, station: CLINYC, icao: KNYC, lat: 40.779, lon: -73.969, elevation_m: 39,   tz: America/New_York,    verified: false}
