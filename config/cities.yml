# Cities are now driven by VERIFIED Kalshi tickers, not guesses.
#
# The 2026-09-04 probe found 21 KXRAIN* series. Fourteen were monthly, two
# were one-off events, and the remainder are listed below. Most of the cities
# in the original version of this file have no daily rain market at all.
#
# `series_rain` / `series_high` must be exact tickers you have confirmed on
# the market's own rules page. Leave them null and the city is skipped --
# that is deliberate. Auto-matching on the title picked the wrong series when
# a city had several (NYC has three rain markets settling on three different
# sources).
#
# `settles_on` is what the probe reported. Record it, because it differs per
# series and changes what your model is actually forecasting.
#
# elevation_m is passed to meteoblue as `asl`. Without it meteoblue infers
# height from its own terrain grid; the mismatch is a slice of the
# grid-to-station temperature bias, ~6.5 C per 1000 m of error.

cities:
  - name: New York
    series_rain: KXRAINDNYC          # "Daily Rain - NYC"
    series_high: null
    settles_on: National Weather Service
    station: CLINYC
    icao: KNYC
    lat: 40.779
    lon: -73.969
    elevation_m: 39
    tz: America/New_York
    verified: false
    # NOTE: two other NYC rain series exist -- KXRAINNY (settles on the
    # U.S. Geological Survey) and KXRAINNYC (NWS Climatological Report).
    # They are different contracts. Check which one you actually want.

  - name: Washington DC
    series_rain: KXRAINDC            # "Daily Rain DC"
    series_high: null
    settles_on: The Weather Channel
    station: CLIDCA
    icao: KDCA
    lat: 38.848
    lon: -77.034
    elevation_m: 5
    tz: America/New_York
    verified: false

  - name: Houston
    series_rain: KXRAINHOU           # cadence unconfirmed -- check markets
    series_high: null
    settles_on: National Weather Service
    station: CLIHOU
    icao: KHOU
    lat: 29.645
    lon: -95.279
    elevation_m: 14
    tz: America/Chicago
    verified: false

  - name: Miami
    series_rain: KXRAINMIA           # cadence unconfirmed -- check markets
    series_high: null
    settles_on: AccuWeather
    station: CLIMIA
    icao: KMIA
    lat: 25.791
    lon: -80.316
    elevation_m: 3
    tz: America/New_York
    verified: false

  - name: Seattle
    series_rain: KXRAINSEA           # cadence unconfirmed -- check markets
    series_high: null
    settles_on: National Weather Service
    station: CLISEA
    icao: KSEA
    lat: 47.444
    lon: -122.314
    elevation_m: 132
    tz: America/Los_Angeles
    verified: false

  - name: New Orleans
    series_rain: KXRAINNO            # cadence unconfirmed -- check markets
    series_high: null
    settles_on: National Weather Service
    station: CLIMSY
    icao: KMSY
    lat: 29.993
    lon: -90.258
    elevation_m: 2
    tz: America/Chicago
    verified: false
