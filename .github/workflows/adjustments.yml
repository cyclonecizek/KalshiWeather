name: Record forecast adjustment
on:
  issues:
    types: [opened]
permissions:
  contents: write
concurrency:
  group: board
  cancel-in-progress: false
jobs:
  record:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Forecast adjustment:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate and archive owner adjustment
        run: python -m pipeline.adjustments
      - name: Persist adjustment journal
        run: |
          git config user.name board-bot
          git config user.email board-bot@users.noreply.github.com
          git add docs/data
          if ! git diff --staged --quiet; then
            git commit -m "Record forecaster adjustment"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
