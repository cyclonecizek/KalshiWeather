name: Build validated data
on:
  workflow_call:
permissions:
  contents: write
concurrency:
  group: board
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache
          key: weather-${{ github.run_id }}
          restore-keys: weather-
      - name: Build and validate both boards
        id: build
        continue-on-error: true
        env:
          METEOBLUE_KEY: ${{ secrets.METEOBLUE_KEY }}
        run: python -m pipeline.run
      - name: Remove restricted legacy diagnostics
        run: python -m pipeline.sanitize
      - name: Commit validated data and update status
        run: |
          git config user.name board-bot
          git config user.email board-bot@users.noreply.github.com
          git add docs/data
          if ! git diff --staged --quiet; then
            git commit -m "Update validated weather forecasts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Surface a partial or failed update
        if: steps.build.outcome == 'failure'
        run: exit 1
