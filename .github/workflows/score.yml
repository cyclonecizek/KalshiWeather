name: Score calibration
on:
  workflow_dispatch:
  schedule:
    - cron: '15 13,21 * * *'
permissions:
  contents: write
concurrency:
  group: board
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.performance
      - name: Persist verification and outcomes
        run: |
          git config user.name board-bot
          git config user.email board-bot@users.noreply.github.com
          git add docs/data
          if ! git diff --staged --quiet; then
            git commit -m "Score forecasts and forecaster adjustments"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
