name: Update plume

on:
  schedule:
    - cron: "20 * * * *"     # hourly; HRRR on AWS is usually complete ~50-80 min after init
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plume-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get install -y --no-install-recommends libeccodes-dev
          pip install -r requirements.txt

      - name: Build plume
        env:
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
        run: python -m pipeline.run

      - name: Commit data
        run: |
          git config user.name  "plume-bot"
          git config user.email "plume-bot@users.noreply.github.com"
          git add docs/data/plume.json cache/points.json
          git diff --cached --quiet && exit 0
          git commit -m "plume $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1

  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          sudo apt-get install -y --no-install-recommends libeccodes-dev
          pip install -r requirements.txt
      - run: python -m pipeline.probe
