name: Review model calibration
on:
  workflow_dispatch:
    inputs:
      key:
        description: 'Exact group from Forecast skill: City|kind|horizon'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: board
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate evidence and record owner approval
        env:
          CALIBRATION_KEY: ${{ inputs.key }}
        run: python -m pipeline.calibration_review
      - run: python -m pipeline.refresh_quotes
      - name: Save reviewed approval
        run: |
          git config user.name board-bot
          git config user.email board-bot@users.noreply.github.com
          git add config/calibration.json docs/data
          if ! git diff --staged --quiet; then
            git commit -m "Record owner-reviewed model calibration"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
