name: Update board
on:
  schedule:
    - cron: '40 3,9,15,21 * * *'
    - cron: '5 0,2,14,16,18,20,22 * * *'
  push:
    branches: [main]
    paths: ['pipeline/**', 'config/**', 'requirements.txt', '.github/workflows/build-data.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/build-data.yml
    secrets: inherit
