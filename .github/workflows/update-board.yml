name: Update board
on:
  schedule:
    # Off the top of the hour; GitHub may delay scheduled runs.
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['pipeline/**', 'config/**', 'requirements.txt', '.github/workflows/build-data.yml', '.github/workflows/update-board.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/build-data.yml
    secrets: inherit
