name: Update board

on:
  schedule:
    # Each run lands after a guidance cycle has finished posting.
    # NBM runs hourly; cycles are picked per city to match local midnight.
    - cron: "40 15 * * *"   # after 12Z  -- the one that matters most
    - cron: "40 21 * * *"   # after 18Z
    - cron: "40 03 * * *"   # after 00Z
    - cron: "40 09 * * *"   # after 06Z
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # pygrib needs the ecCodes C library; the wheel does not bundle it.
      - name: Install ecCodes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev

      - name: Install Python deps
        run: pip install -r requirements.txt

      # MUST come before the first build. Runners are ephemeral, so without a
      # restored cache every build refetches meteoblue from scratch -- and
      # since both boards share one cached call per city per day, restoring
      # after the rain step means paying for the same data twice.
      #
      # The Actions cache is also not served by Pages, which keeps
      # meteoblue's data out of the published site.
      - name: Restore meteoblue cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: meteoblue-${{ github.run_id }}
          restore-keys: meteoblue-

      # A partial board beats a stale one, so a single dead source does not
      # fail the job. Each build exits non-zero only if it got nothing at all.
      #
      # Both steps need their own env block. A repository secret is NOT
      # automatically visible to a step -- this is the single most common
      # reason the board reports "meteoblue: no key set".
      - name: Build rain board
        timeout-minutes: 12
        env:
          METEOBLUE_KEY: ${{ secrets.METEOBLUE_KEY }}
        run: python -m pipeline.build
        continue-on-error: true

      - name: Build temperature board
        timeout-minutes: 8
        env:
          METEOBLUE_KEY: ${{ secrets.METEOBLUE_KEY }}
        run: python -m pipeline.build_temp
        continue-on-error: true

      - name: Commit
        run: |
          git config user.name  "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add docs/data
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "board $(date -u '+%Y-%m-%d %H:%MZ')"
            git push
          fi

      # 60 days is enough history to fit the calibration offsets.
      - name: Prune history
        run: |
          find docs/data/history -name '*.json' -mtime +60 -delete || true
          git add -A docs/data/history
          git diff --staged --quiet || { git commit -m "prune history"; git push; }
