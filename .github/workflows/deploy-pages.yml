name: Deploy Pages

# Publishes docs/ as a static site without Jekyll touching it.
#
# TRIGGERING. A `push` trigger is NOT enough here. When Update board commits
# new JSON it authenticates with the default GITHUB_TOKEN, and GitHub
# deliberately does not let a GITHUB_TOKEN push start another workflow -- it
# is their loop guard. The result is a repo whose data updates on schedule
# while the published site never rebuilds.
#
# `workflow_run` is exempt from that rule, so this chains off the builders
# directly. The schedule below is a backstop in case a run is missed.

on:
  workflow_run:
    workflows: ["Update board", "Intraday refresh"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  schedule:
    - cron: "20 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deliberately NOT the "board" group. Sharing a concurrency group with the
# hourly builders meant deploys queued behind them and got cancelled --
# GitHub keeps only one pending run per group.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # workflow_run checks out the default SHA, which
                             # predates the data commit we want to publish

      - name: Fail loudly if docs/ is missing
        run: |
          if [ ! -f docs/index.html ]; then
            echo "docs/index.html not found. Repo root contains:"
            ls -a
            exit 1
          fi
          echo "publishing board generated at:"
          python3 -c "import json;print(' ',json.load(open('docs/data/board.json'))['generated_at'])" || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
