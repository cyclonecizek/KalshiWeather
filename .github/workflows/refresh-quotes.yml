name: Refresh market quotes
on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
permissions:
  contents: write
concurrency:
  group: board
  cancel-in-progress: false
jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.refresh_quotes
      - name: Publish refreshed quotes
        run: |
          git config user.name board-bot
          git config user.email board-bot@users.noreply.github.com
          git add docs/data/board.json docs/data/board_temp.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh market quotes without changing forecast issuance"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
