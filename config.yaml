# Plume Constraint configuration.
# Everything site- and constraint-specific lives here; the code stays generic.

site:
  lat: 28.5620
  lon: -80.5772
  height_ft: 200            # evaluation height above ground
  display_tz: America/New_York

# Wind constraint. A NO-GO requires magnitude AND direction to violate together;
# the combined level for each member is the lower of the two individual levels.
constraint:
  magnitude_mph:
    assess_at_or_above: 5.8   # below this = GO
    nogo_above: 8.4
  direction_deg:
    go_arc: [155, 60]         # clockwise from first to second, inclusive (wraps through north)
    nogo_arc: [80, 135]       # inclusive; anything outside go_arc and nogo_arc = assessment

window:
  hours_back: 12
  hours_ahead: 96

# Vertical adjustment to the evaluation height.
#  - Two model levels bracketing the height: u/v interpolated linearly in ln(z).
#  - One level only: power-law scaling with this exponent.
#  - Gust at height = mean wind at height + (10 m gust - 10 m mean wind).
vertical:
  power_law_alpha: 0.14

# Relative weight per source. At each hour a source's weight is split evenly
# across its members that have data at that hour, so a 51-member ensemble
# does not outvote a 6-member time-lagged hi-res ensemble by sheer count.
sources:
  - id: hrrr
    kind: hrrr
    label: HRRR time-lagged
    family: hires
    weight: 3
    lag_cycles: 6            # latest N hourly cycles (18 h reach)
    synoptic_extra: 2        # plus the latest N 00/06/12/18Z cycles (48 h reach)

  - id: rrfs
    kind: rrfs
    label: RRFS time-lagged
    family: hires
    weight: 3
    lag_cycles: 4
    synoptic_extra: 2
    bases:                   # tried in order; first one with data wins
      - https://nomads.ncep.noaa.gov/pub/data/nccf/com/rrfs/prod
      - https://nomads.ncep.noaa.gov/pub/data/nccf/com/rrfs/v1.0
      - https://nomads.ncep.noaa.gov/pub/data/nccf/com/rrfs/para
    file: "rrfs.{ymd}/{hh}/rrfs.t{hh}z.prslev.3km.f{fh:03d}.conus.grib2"

  - id: refs
    kind: ensprod
    label: REFS
    family: hires
    weight: 3
    pseudo_members: 20       # REFS publishes mean + spread, not members
    max_fh: 60
    bases:
      - https://nomads.ncep.noaa.gov/pub/data/nccf/com/refs/prod
      - https://nomads.ncep.noaa.gov/pub/data/nccf/com/refs/v1.0
      - https://nomads.ncep.noaa.gov/pub/data/nccf/com/refs/para
    files:
      mean: "refs.{ymd}/{hh}/ensprod/refs.t{hh}z.mean.f{fh:02d}.conus.grib2"
      sprd: "refs.{ymd}/{hh}/ensprod/refs.t{hh}z.sprd.f{fh:02d}.conus.grib2"

  # HREF membership built from the member models themselves (NCEP only
  # publishes HREF mean/prob products, not the members). Mirrors HREF v3:
  # HiResW ARW, ARW mem2 and FV3 (00/12Z, current + 12 h old), NAM 3 km and
  # HRRR (00/06/12/18Z, current + 6 h old) = 10 members.
  # These legacy models retire when RRFS/REFS go operational; the source
  # then shows "missing" and REFS carries on.
  - id: href
    kind: multi_model
    label: HREF members
    family: hires
    weight: 3
    components:
      - id: ARW
        base: https://nomads.ncep.noaa.gov/pub/data/nccf/com/hiresw/prod
        file: "hiresw.{ymd}/hiresw.t{hh}z.arw_2p5km.f{fh:02d}.conus.grib2"
        cycles: [0, 12]
        lag: 2
        max_fh: 48
      - id: ARW2
        base: https://nomads.ncep.noaa.gov/pub/data/nccf/com/hiresw/prod
        file: "hiresw.{ymd}/hiresw.t{hh}z.arw_2p5km.f{fh:02d}.conusmem2.grib2"
        cycles: [0, 12]
        lag: 2
        max_fh: 48
      - id: FV3
        base: https://nomads.ncep.noaa.gov/pub/data/nccf/com/hiresw/prod
        file: "hiresw.{ymd}/hiresw.t{hh}z.fv3_2p5km.f{fh:02d}.conus.grib2"
        cycles: [0, 12]
        lag: 2
        max_fh: 48
      - id: NAM3k
        base: https://nomads.ncep.noaa.gov/pub/data/nccf/com/nam/prod
        file: "nam.{ymd}/nam.t{hh}z.conusnest.hiresf{fh:02d}.tm00.grib2"
        cycles: [0, 6, 12, 18]
        lag: 2
        max_fh: 60
      - id: HRRR
        base: https://noaa-hrrr-bdp-pds.s3.amazonaws.com
        file: "hrrr.{ymd}/conus/hrrr.t{hh}z.wrfsfcf{fh:02d}.grib2"
        cycles: [0, 6, 12, 18]
        lag: 2
        max_fh: 48

  - id: nam3k
    kind: multi_model
    label: NAM 3 km
    family: hires
    weight: 2
    components:
      - id: NAM3k
        base: https://nomads.ncep.noaa.gov/pub/data/nccf/com/nam/prod
        file: "nam.{ymd}/nam.t{hh}z.conusnest.hiresf{fh:02d}.tm00.grib2"
        cycles: [0, 6, 12, 18]
        lag: 4                   # last four cycles = 24 h of time-lagging
        max_fh: 60

  - id: nbm
    kind: openmeteo_det
    label: NBM
    family: blend
    weight: 2
    model: ncep_nbm_conus

  - id: ndfd
    kind: nws_grid
    label: NDFD
    family: blend
    weight: 1

  - id: meteoblue
    kind: meteoblue
    label: meteoblue
    family: blend
    weight: 1                # skipped unless METEOBLUE_API_KEY is set

  - id: ecmwf_ens
    kind: openmeteo_ens
    label: ECMWF ENS
    family: global
    weight: 2
    model: ecmwf_ifs025

  - id: aifs_ens
    kind: openmeteo_ens
    label: ECMWF AIFS ENS
    family: global
    weight: 1
    model: ecmwf_aifs025

  - id: gefs
    kind: openmeteo_ens
    label: GEFS
    family: global
    weight: 1
    model: gfs025

  - id: icon_eps
    kind: openmeteo_ens
    label: ICON EPS
    family: global
    weight: 1
    model: icon_seamless

  - id: gem_eps
    kind: openmeteo_ens
    label: GEM EPS
    family: global
    weight: 1
    model: gem_global
